<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">

<style>
:root{--bg:#f6f7f9;--card:#fff;--ink:#111827;--mute:#6b7280;--line:#eceef1;--tray:#eef0f3;--pri:#1a6aff;--pri-soft:#edf3ff;--ok:#15803d;--ok-soft:#e8f7ee;--bad:#dc2626;--bad-soft:#fef0f0;--warn:#a16207;--warn-soft:#fff8e1;--org:#ea580c;--org-soft:#fff1e6;--r:18px;--sh:0 1px 2px rgba(17,24,39,.04),0 6px 20px rgba(17,24,39,.05);color-scheme:light}
@media (prefers-color-scheme:dark){:root{--bg:#0d1117;--card:#161b22;--ink:#f0f3f6;--mute:#9198a1;--line:#262c36;--tray:#1d232c;--pri:#4d8dff;--pri-soft:#14284d;--ok:#3fb950;--ok-soft:#12261a;--bad:#f85149;--bad-soft:#2d1416;--warn:#d29922;--warn-soft:#2b2210;--org:#fb8f44;--org-soft:#2e1b0e;--sh:none;color-scheme:dark}}
[hidden]{display:none!important}*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 Pretendard,"Apple SD Gothic Neo",system-ui,sans-serif;-webkit-font-smoothing:antialiased}
.wrap{max-width:1100px;margin:0 auto;padding-block:16px 56px;padding-left:max(14px,env(safe-area-inset-left,0px));padding-right:max(14px,env(safe-area-inset-right,0px));display:flex;flex-direction:column;gap:14px}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--sh);padding:18px;min-width:0}
.hd{display:flex;align-items:center;gap:10px;margin:0 0 12px;font-size:17px;font-weight:800}.hd .ic{width:34px;height:34px;border-radius:11px;display:grid;place-items:center;font-size:18px;flex:none}.hd small{margin-left:auto;font-size:12px;font-weight:600;color:var(--mute)}
.num{font-variant-numeric:tabular-nums}
.top{display:flex;align-items:center;gap:12px}.logo{width:48px;height:48px;border-radius:15px;background:linear-gradient(135deg,#4d8dff,#1a6aff);display:grid;place-items:center;font-size:24px;box-shadow:0 6px 16px rgba(26,106,255,.3);flex:none}
.top h1{margin:0;font-size:22px;font-weight:900;letter-spacing:-.4px}.top p{margin:0;font-size:12.5px;color:var(--mute)}
.verdict{border-radius:var(--r);padding:16px 18px;display:flex;align-items:center;gap:14px;font-weight:800;font-size:18px;line-height:1.35}
.verdict .em{font-size:34px;flex:none}.verdict small{display:block;font-size:13px;font-weight:600;opacity:.85}
.v-ok{background:var(--ok-soft);color:var(--ok)}.v-warn{background:var(--org-soft);color:var(--org)}
.pills{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.pill{border-radius:16px;padding:12px 10px;text-align:center;background:var(--card);border:1px solid var(--line);box-shadow:var(--sh)}.pill b{display:block;font-size:30px;font-weight:900;line-height:1.1}.pill span{font-size:12px;color:var(--mute);font-weight:600}
.pill.p-done b{color:var(--ok)}.pill.p-left b{color:var(--pri)}.pill.p-ask b{color:var(--org)}
.asks{background:linear-gradient(180deg,var(--org-soft),var(--card) 70%);border:2px solid var(--org)}
.ask{display:grid;grid-template-columns:30px minmax(0,1fr) auto;gap:10px;align-items:center;padding:10px 0;border-top:1px dashed var(--line)}
.ask .go{background:var(--org);color:#fff;font-weight:800;font-size:14px;padding:9px 14px;border-radius:999px;text-decoration:none;white-space:nowrap;min-height:40px;display:inline-flex;align-items:center}.ask .go:active{transform:scale(.96)}.ask:first-of-type{border-top:0}
.ask i{font-style:normal;width:30px;height:30px;border-radius:50%;background:var(--org);color:#fff;display:grid;place-items:center;font-weight:900}.ask b{display:block;font-size:15.5px}.ask small{color:var(--mute);font-size:12.5px}
.tiles{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px}@media (max-width:760px){.tiles{grid-template-columns:repeat(2,minmax(0,1fr))}}

.tile span{font-size:12.5px;color:var(--mute);font-weight:600}.tile b{font-size:32px;font-weight:900;letter-spacing:-1px;line-height:1.15}
.chg{align-self:flex-start;font-size:12px;font-weight:800;padding:3px 8px;border-radius:999px;background:var(--tray);color:var(--mute);margin-top:4px}.chg.up{background:var(--ok-soft);color:var(--ok)}.chg.down{background:var(--bad-soft);color:var(--bad)}
.c-blue{background:var(--pri-soft)}.c-green{background:var(--ok-soft)}.c-org{background:var(--org-soft)}.c-yel{background:var(--warn-soft)}.c-red{background:var(--bad-soft)}.c-gray{background:var(--tray)}
.sales{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:12px}
.sl{border-radius:14px;padding:12px;background:var(--tray)}.sl.win{background:linear-gradient(135deg,#fff4e5,#ffe4e1)}@media (prefers-color-scheme:dark){.sl.win{background:#2e1b0e}}
.sl .t{display:flex;justify-content:space-between;align-items:baseline;gap:8px;font-weight:700;font-size:14px}.sl .t b{font-size:20px;font-weight:900}.sl .t b small{font-size:13px;color:var(--mute);font-weight:700}
.bar{height:12px;border-radius:8px;background:var(--line);overflow:hidden;margin:8px 0 6px}.bar i{display:block;height:100%;border-radius:8px;background:var(--pri)}.bar i.hot{background:linear-gradient(90deg,#f59e0b,#ef4444)}
.sl .m{font-size:13px;font-weight:800;color:var(--pri)}.sl.win .m{color:#dc2626}
.cols{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}@media (max-width:760px){.cols{grid-template-columns:minmax(0,1fr)}}
.tl{list-style:none;margin:0;padding:0}.tl li.ok time{color:var(--ok)}.tl li.ok time::before{content:"✓";margin-right:3px}.okm{color:var(--ok);font-weight:800;font-style:normal}
.tl li{display:grid;grid-template-columns:58px minmax(0,1fr);gap:10px;padding:9px 0;border-top:1px solid var(--line)}.tl li:first-child{border-top:0}
.tl time{font-weight:800;color:var(--mute);font-variant-numeric:tabular-nums;font-size:13.5px}.tl small{display:block;font-size:12px;color:var(--mute);font-weight:600}.tl a{color:var(--ink);text-decoration:none;border-bottom:1px solid var(--line)}
.next{background:var(--pri-soft);border-radius:14px;padding:12px;margin-bottom:6px;display:flex;align-items:center;gap:12px}.next b{font-size:22px;font-weight:900;color:var(--pri);font-variant-numeric:tabular-nums}.next div{font-weight:800}.next small{display:block;font-size:12px;color:var(--mute);font-weight:600}
details summary{cursor:pointer;color:var(--mute);font-size:13px;font-weight:600;margin-top:8px}
.dd{display:flex;align-items:center;gap:12px;padding:10px 0;border-top:1px solid var(--line)}.dd:first-of-type{border-top:0}
.badge{flex:none;min-width:58px;text-align:center;font-weight:900;font-size:16px;padding:6px 8px;border-radius:12px;background:var(--tray);color:var(--ink);font-variant-numeric:tabular-nums}.badge.hot{background:var(--org);color:#fff}.badge.blue{background:var(--pri);color:#fff}
.dd .x{min-width:0}.dd .x b{display:block;font-size:14.5px}.dd .x small{font-size:12px;color:var(--mute)}.dd a{color:inherit}
.rows .r{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:4px 10px;padding:9px 0;border-top:1px solid var(--line);align-items:center}.rows .r:first-child{border-top:0}
.rows .r .nm{font-weight:700}.rows .r .v{font-weight:900;font-size:18px;text-align:right;font-variant-numeric:tabular-nums}.rows .r .v small{font-size:12px;font-weight:800}.rows .r .s{grid-column:1/-1;font-size:12px;color:var(--mute);display:flex;gap:10px;flex-wrap:wrap}.rows .r .s em{font-style:normal;font-weight:800}.up{color:var(--ok)}.down{color:var(--bad)}
.mini{height:6px;border-radius:4px;background:var(--line);overflow:hidden;grid-column:1/-1}.mini i{display:block;height:100%;background:var(--pri);border-radius:4px}
.chart svg{display:block;width:100%;height:auto}.chart text{fill:var(--mute);font-size:11px}
.chips{display:flex;flex-wrap:wrap;gap:8px}.chip{font-size:13.5px;font-weight:700;padding:8px 12px;border-radius:999px;background:var(--tray)}.chip b{color:var(--pri);margin-right:6px}
.an{display:grid;grid-template-columns:auto minmax(0,1fr);gap:4px 12px;padding:12px 0;border-top:1px solid var(--line);align-items:start}.an:first-of-type{border-top:0}.an .st{grid-row:span 3;font-size:12px;font-weight:900;padding:6px 9px;border-radius:10px;text-align:center;min-width:64px;line-height:1.25}.an .st em{display:block;font-style:normal;font-size:11px;font-weight:700;opacity:.85}.st-up{background:var(--ok-soft);color:var(--ok)}.st-down{background:var(--bad-soft);color:var(--bad)}.st-flat{background:var(--tray);color:var(--mute)}.st-warn{background:var(--org-soft);color:var(--org)}.an b{font-size:15px}.an .dt{font-size:12.5px;color:var(--mute)}.an .ac{font-size:13px;font-weight:800;color:var(--pri)}
.chip.hot{background:var(--org);color:#fff}.chip.hot b{color:#fff}
/* 1111 MJ '11월 달력에 해야 하는 스케줄을 한 번에 · 캘린더처럼' */
.cal-lg{display:flex;flex-wrap:wrap;gap:6px 12px;margin:-4px 0 10px;font-size:12px;font-weight:700;color:var(--mute)}.cal-lg span::before{content:"";display:inline-block;width:9px;height:9px;border-radius:50%;background:var(--c);margin-right:5px}
.cal{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:4px}
.cw{text-align:center;font-size:12px;font-weight:800;color:var(--mute);padding:2px 0}.cw:first-child{color:var(--bad)}.cw:nth-child(7){color:var(--pri)}
.cd{font:inherit;color:inherit;text-align:left;background:var(--tray);border:2px solid transparent;border-radius:12px;padding:6px;min-height:96px;display:flex;flex-direction:column;gap:4px;cursor:pointer;min-width:0;overflow:hidden}
.cd>b{font-size:13px;font-weight:800}.cd.sun>b{color:var(--bad)}.cd.sat>b{color:var(--pri)}.cd.past{opacity:.5}.cd.today{background:var(--pri-soft);border-color:var(--pri)}.cd.today>b::after{content:" 오늘";font-size:11px;color:var(--pri)}.cd.sel{border-color:var(--ink)}
.cd .dots{display:flex;flex-direction:column;gap:3px;min-width:0}
.cd i.dn{opacity:.55;text-decoration:line-through}.cd i{font-style:normal;font-size:11px;font-weight:700;line-height:1.3;padding:2px 5px;border-radius:6px;background:color-mix(in srgb,var(--c) 15%,transparent);border-left:3px solid var(--c);overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;word-break:keep-all}
.cd em{font-style:normal;font-size:11px;color:var(--mute);font-weight:800}
@media (max-width:760px){.cd{min-height:56px;padding:6px 3px;align-items:center;gap:5px}.cd.today>b::after{content:""}.cd .dots{flex-direction:row;flex-wrap:wrap;justify-content:center}.cd i{width:8px;height:8px;padding:0;border:0;border-radius:50%;background:var(--c);font-size:0}.cd em{display:none}}
.cal-ag{margin-top:12px;display:flex;flex-direction:column;gap:6px}
.cal-ag h4{margin:8px 0 0;font-size:14px;font-weight:900;display:flex;gap:8px;align-items:baseline}.cal-ag h4 small{font-size:12px;color:var(--org);font-weight:800}

.ce{display:grid;grid-template-columns:56px minmax(0,1fr);gap:10px;padding:9px 12px;border-radius:12px;background:var(--tray);border-left:4px solid var(--c)}
.ce time{font-weight:800;font-size:13px;color:var(--mute);font-variant-numeric:tabular-nums}.ce b{font-size:14.5px}.ce a{color:inherit}.ce small{display:block;font-size:12px;color:var(--mute);font-weight:600}.ce.done{opacity:.55}.ce.done b{text-decoration:line-through}
.cal-all{font:inherit;font-size:13px;font-weight:800;color:var(--pri);background:none;border:0;cursor:pointer;padding:8px 0;align-self:flex-start}
.rvs{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px;margin-bottom:10px}@media (max-width:760px){.rvs{grid-template-columns:repeat(2,minmax(0,1fr))}}
.rvs>div{background:var(--tray);border-radius:14px;padding:10px 12px;display:flex;flex-direction:column;gap:2px;min-width:0}.rvs span{font-size:12px;color:var(--mute);font-weight:700}.rvs b{font-size:22px;font-weight:900;letter-spacing:-.5px;font-variant-numeric:tabular-nums}.rvs small{font-size:11.5px;color:var(--mute);font-weight:600}.rvs .off b{color:var(--mute);font-size:17px}
.rvc svg{display:block;width:100%;height:auto}.rvc text{fill:var(--mute);font-size:17px}
.bgh{display:flex;align-items:baseline;gap:8px;font-weight:900;font-size:14.5px;margin:12px 0 2px;padding-top:10px;border-top:2px solid var(--line)}.bgh:first-of-type{margin-top:0;padding-top:0;border-top:0}.bgh small{margin-left:auto;font-size:12px;color:var(--mute);font-weight:700}
.lg{font-style:normal;font-size:11px;font-weight:800;padding:2px 6px;border-radius:6px;background:var(--pri-soft);color:var(--pri);margin-right:6px;vertical-align:1px}
/* 1113 MJ '채울 칸 지도 — 뭐가 어떻게 되고 있는지 눈에 잘 안 띄어' → 판정 줄·칸 구성 막대·밀린 칸·MJ 차례·칸마다 글자 상태·SNS 개수 */
.mv{border-radius:14px;padding:12px 14px;font-weight:900;font-size:15.5px;line-height:1.35;margin-bottom:12px}.mv small{display:block;font-size:12.5px;font-weight:700;opacity:.88;margin-top:3px}.mv.ok{background:var(--ok-soft);color:var(--ok)}.mv.bad{background:var(--bad-soft);color:var(--bad)}
.msh{display:flex;align-items:baseline;gap:8px;font-size:13.5px;font-weight:800;margin-bottom:6px}.msh b{margin-left:auto;font-size:15px;font-weight:900;font-variant-numeric:tabular-nums}
.msb{display:flex;gap:2px;height:14px;border-radius:8px;overflow:hidden;background:var(--line)}.msb i{display:block;height:100%;min-width:6px}
.mlg{display:flex;flex-wrap:wrap;gap:4px 14px;margin:8px 0 12px;font-size:12.5px;font-weight:700;color:var(--mute)}.mlg span::before{content:"";display:inline-block;width:10px;height:10px;border-radius:3px;background:var(--c);margin-right:5px;vertical-align:-1px}.mlg b{color:var(--ink);font-variant-numeric:tabular-nums;margin-left:3px}
.mlate{border:2px solid var(--bad);background:var(--bad-soft);border-radius:14px;padding:10px 12px;margin-bottom:12px}.mlate>b{display:block;color:var(--bad);font-size:14px}
.mrow{display:grid;grid-template-columns:auto minmax(0,1fr);gap:10px;align-items:center;padding:8px 0;border-top:1px dashed color-mix(in srgb,var(--bad) 35%,transparent)}.mlate>b+.mrow{border-top:0}
.mrow .mb{font-size:12px;font-weight:900;padding:4px 9px;border-radius:999px;background:var(--bad);color:#fff;white-space:nowrap}.mrow b{display:block;font-size:14px}.mrow small{display:block;font-size:12.5px;color:var(--mute);font-weight:600}
.mmj{border:2px solid var(--org);background:var(--org-soft);border-radius:14px;padding:10px 12px;margin-bottom:14px}.mmj>b{display:block;font-size:14px;color:var(--org)}.mmj>small{display:block;font-size:12.5px;color:var(--mute);font-weight:700;margin:1px 0 8px}
.mmj ol{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:6px}.mmj li{display:grid;grid-template-columns:30px minmax(0,1fr);gap:10px;align-items:center;background:var(--card);border-radius:12px;padding:8px 10px}
.mmj li i{font-style:normal;width:30px;height:30px;border-radius:50%;background:var(--org);color:#fff;display:grid;place-items:center;font-weight:900;font-size:13px}.mmj li b{display:block;font-size:14px}.mmj li small{display:block;font-size:12px;color:var(--mute);font-weight:600}
.mkey{margin:0 0 6px;font-size:12px;font-weight:700;color:var(--mute)}
.mp{display:grid;grid-template-columns:minmax(76px,1.25fr) repeat(4,minmax(0,1fr));gap:4px}
.mh{font-size:12px;font-weight:800;color:var(--mute);text-align:center;padding-bottom:2px}.mt{font-size:13px;font-weight:800;display:flex;align-items:center;line-height:1.25;word-break:keep-all;overflow-wrap:anywhere;min-width:0}
.mc{border-radius:10px;padding:6px 2px;text-align:center;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;min-width:0;min-height:48px;line-height:1.2}
.mc b{font-size:13px;font-weight:900;white-space:nowrap}.mc small{font-size:11px;font-weight:700;white-space:nowrap}.mc em{font-style:normal;font-size:11px;font-weight:800;white-space:nowrap;margin-top:2px}
.k-on{background:var(--ok-soft);color:var(--ok)}.k-today{background:var(--pri);color:#fff}.k-soon{background:var(--pri-soft);color:var(--pri)}.k-late{background:var(--bad);color:#fff}
.k-hold{background:var(--tray);color:var(--mute)}.k-todo{background:var(--org-soft);color:var(--org);outline:1.5px dashed var(--org);outline-offset:-2px}.k-na{border:1px dashed var(--line);color:color-mix(in srgb,var(--mute) 70%,transparent)}
.msns{margin-top:14px;padding-top:12px;border-top:1px solid var(--line)}.msns>b{display:block;font-size:14.5px;font-weight:900}.msns>small{display:block;font-size:12.5px;color:var(--mute);font-weight:700}
.mpf{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:6px;margin:8px 0 0}.mpf div{background:var(--tray);border-radius:12px;padding:6px 2px;text-align:center;font-size:12px;font-weight:700;color:var(--mute);min-width:0}
.mpf b{display:block;font-size:20px;font-weight:900;color:var(--ink);line-height:1.2;font-variant-numeric:tabular-nums}.mpf .z b{color:var(--mute)}.mpf em{display:block;font-style:normal;font-size:11px;font-weight:800;color:var(--org)}
.msns ul{list-style:none;margin:6px 0 0;padding:0}.msns li{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:10px;padding:7px 0;border-top:1px solid var(--line);font-size:13px;font-weight:700}.msns li:first-child{border-top:0}.msns li span{text-align:right}.msns li em{font-style:normal;color:var(--org);display:block;font-size:12px}
/* 1113 MJ '오른쪽에 캐나다 밴쿠버 현재 시간도' */
.vclk{margin-left:auto;flex:none;text-align:right;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:6px 12px;box-shadow:var(--sh);line-height:1.3}.vclk span,.vclk small{display:block;font-size:11.5px;font-weight:700;color:var(--mute)}.vclk b{display:block;font-size:16px;font-weight:900;font-variant-numeric:tabular-nums;white-space:nowrap}
.top>div:nth-child(2){flex:1;min-width:0}
@media (min-width:700px){.mc b{font-size:15px}.mc small,.mc em{font-size:12px}}
@media (max-width:600px){.top{flex-wrap:wrap}.vclk{flex:1 1 100%;margin-left:0;display:flex;align-items:baseline;gap:8px;text-align:left;padding:7px 12px}.vclk span,.vclk small{display:inline;white-space:nowrap}.vclk b{font-size:15px}.vclk small{margin-left:auto}}
.fund{border-radius:16px;padding:12px 14px;margin-bottom:10px;background:linear-gradient(135deg,var(--pri-soft),var(--ok-soft))}.fund .t{display:flex;align-items:baseline;gap:8px;font-weight:900;font-size:15px}.fund .t small{margin-left:auto;font-size:12px;color:var(--mute);font-weight:700}

<div id="gate" class="gate"><form id="gf"><div class="logo">📋</div><h1>MJ 오늘의 전광판</h1><p>비밀번호를 넣어 주세요. 이 기기에 기억돼요.</p><input id="code" type="password" inputmode="numeric" autocomplete="current-password" aria-label="비밀번호"><button>열기</button><div class="err" id="err"></div></form></div>
<div id="app" class="wrap" hidden></div>
<script>
window.MOB = /Android|iPhone|iPad|iPod|Mobile/i.test(navigator.userAgent);   // 1112 시작 버튼: 폰=t.me · PC·맥=tg://
const $ = (h) => { const t = document.createElement('template'); t.innerHTML = h.trim(); return t.content.firstChild; };
const esc = (s) => String(s ?? '').replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const fmt = (n) => n == null ? '—' : Number(n).toLocaleString('ko-KR'), sg = (n) => n == null ? '' : (n > 0 ? '▲ ' : n < 0 ? '▼ ' : '') + fmt(Math.abs(n)), ud = (n) => n > 0 ? 'up' : n < 0 ? 'down' : '';
const b64 = (s) => Uint8Array.from(atob(s), (c) => c.charCodeAt(0));
async function open(code) {
  const e = await (await fetch('data.enc.json?t=' + Date.now(), { cache: 'no-store' })).json();
  const km = await crypto.subtle.importKey('raw', new TextEncoder().encode(code), 'PBKDF2', false, ['deriveKey']);
  const key = await crypto.subtle.deriveKey({ name: 'PBKDF2', salt: b64(e.salt), iterations: e.iter, hash: 'SHA-256' }, km, { name: 'AES-GCM', length: 256 }, false, ['decrypt']);
  return JSON.parse(new TextDecoder().decode(await crypto.subtle.decrypt({ name: 'AES-GCM', iv: b64(e.iv) }, key, b64(e.data))));
}
const WD = ['일', '월', '화', '수', '목', '금', '토'];
// 1113 MJ '오른쪽에 캐나다 밴쿠버 현재 시간도' — 브라우저가 계산(서머타임 자동), 30초마다
const wall = (tz, t) => { const p = Object.fromEntries(new Intl.DateTimeFormat('en-US', { timeZone: tz, hourCycle: 'h23', year: 'numeric', month: 'numeric', day: 'numeric', hour: 'numeric', minute: 'numeric' }).formatToParts(t).map((x) => [x.type, +x.value])); return Date.UTC(p.year, p.month - 1, p.day, p.hour, p.minute); };
function vclock() { const el = document.getElementById('vclk'); if (!el) return; const t = new Date(), w = new Date(wall('America/Vancouver', t)), h = w.getUTCHours(), gap = Math.round((wall('Asia/Seoul', t) - w) / 36e5);
  el.innerHTML = `<span>🇨🇦 밴쿠버 지금</span><b>${w.getUTCMonth() + 1}/${w.getUTCDate()}(${WD[w.getUTCDay()]}) ${h < 12 ? '오전' : '오후'} ${h % 12 || 12}:${String(w.getUTCMinutes()).padStart(2, '0')}</b><small>한국보다 ${gap}시간 느려요</small>`; }
setInterval(vclock, 30e3);
function render(d) {
  const at = new Date(d.at), left = d.schedule.filter((x) => x.state === '남음'), past = d.schedule.filter((x) => x.state !== '남음'), asks = d.asks || [];
  const s2h = d.youtube.some((r) => r.subs_2h != null) ? d.youtube.reduce((s, r) => s + (r.subs_2h || 0), 0) : null, VT0 = d.visits_today || null;   // 1112 MJ '2시간에 한 번 수치 변화·구독자 변화'
  const S = d.sales || [], won = S.filter((x) => x.done).length, subs = d.youtube.reduce((s, r) => s + (r.subs || 0), 0), subsCh = d.youtube.some((r) => r.subs_change != null) ? d.youtube.reduce((s, r) => s + (r.subs_change || 0), 0) : null;
  const v = d.naver_visits, vl = v.length ? v[v.length - 1] : null, vch = v.length > 1 ? v[v.length - 1].visitors - v[v.length - 2].visitors : null;
  const posts = d.blogs.reduce((s, r) => s + (r.today || 0), 0), wk = (d.usage.find((u) => u.name === '주간 사용량') || {}).percent, wkR = (() => { const r = (d.usage.find((u) => u.name === '주간 사용량') || {}).reset; if (!r) return ''; const t = new Date(r * 1000 + 9 * 36e5); return ` · 리셋 ${t.getUTCMonth() + 1}/${t.getUTCDate()}(${'일월화수목금토'[t.getUTCDay()]}) ${t.getUTCHours() < 12 ? '오전' : '오후'} ${t.getUTCHours() % 12 || 12}시`; })();   // 1113 MJ '주간 사용량 언제 리셋되는지도 여기에'
  const root = document.getElementById('app'), app = document.createElement('div'); root.replaceChildren(app); app.className = 'tabp';   // app = 전광판 칸 (1112 댓글 칸과 탭으로 나눔)
  root.prepend($(`<div class="top"><div class="logo">📋</div><div><h1>MJ 오늘의 전광판</h1><p>${at.getMonth() + 1}월 ${at.getDate()}일 (${WD[at.getDay()]}) ${String(at.getHours()).padStart(2, '0')}:${String(at.getMinutes()).padStart(2, '0')} 기준 · 매시 7분 자동 새로 고침 · <a href="eng.html" style="color:var(--pri);font-weight:800">📚 영어 7일 쉐도잉</a></p></div><div class="vclk" id="vclk" aria-live="off"></div></div>`)); vclock();
  // 1111 MJ '셋팅할 것들을 제일 위에 · 할 일들이잖아'
  const T = d.setup || [];
  if (T.length) app.append($(`<section class="card"><div class="hd"><span class="ic c-org">📌</span>MJ 할 일 ${T.length}개<small>"○번 알려줘" → 한 단계씩</small></div><div class="chips">${[...T].sort((x, y) => /🔥/.test(y.what) - /🔥/.test(x.what)).map((t) => `<span class="chip${/🔥/.test(t.what) ? ' hot' : ''}"><b>${t.no}</b>${esc(t.what)}</span>`).join('')}</div></section>`));
  app.append(asks.length
    ? $(`<div class="verdict v-warn"><span class="em">🙋</span><div>MJ가 정해 줄 게 ${asks.length}개 있어요<small>아래 주황 칸부터 보고 텔레그램으로 답해 주세요</small></div></div>`)
    : $(`<div class="verdict v-ok"><span class="em">✅</span><div>다 순조로워요. 정해 줄 건 없어요<small>오늘 해낸 일 ${d.done.length}개 · 남은 예약 ${left.length}개</small></div></div>`));
  app.append($(`<div class="pills"><div class="pill p-done"><b class="num pop">${d.done.length}</b><span>✅ 오늘 해낸 일</span></div><div class="pill p-left"><b class="num pop">${left.length}</b><span>⏰ 남은 예약</span></div><div class="pill p-ask"><b class="num pop">${asks.length}</b><span>🙋 정해 줄 것</span></div></div>`));
  if (asks.length) app.append($(`<section class="card asks"><div class="hd"><span class="ic c-org">🙋</span>MJ가 정해 주세요</div>${asks.map((a, i) => { const t = '▶ 시작: ' + a.ask; return `<div class="ask"><i>${i + 1}</i><div><b>${esc(a.ask)}</b><small>${esc([a.since, a.why].filter(Boolean).join(' · '))}</small></div>${d.bot ? `<a class="go" href="${MOB ? `https://t.me/${esc(d.bot)}?text=${encodeURIComponent(t)}` : `tg://resolve?domain=${esc(d.bot)}&text=${encodeURIComponent(t)}`}"${MOB ? ' target="_blank" rel="noopener"' : ''} data-t="${esc(t)}" aria-label="${esc(a.ask)} 시작 — 텔레그램으로 한 단계씩 안내">▶ 시작</a>` : ''}</div>`; }).join('')}</section>`));
  const CAP = d.capacity; if (CAP) { const CP = CAP;   // 1112 MJ '한계를 명확히 — 지금 몇 개 · 몇 개 늘릴 수 있는지'
    const tot = CP.channels.reduce((a, c) => a + c.n, 0), nx = (CP.next || []).reduce((a, c) => a + c.n, 0), sub = (t) => `<small style="display:block;font-weight:600;color:var(--mute);font-size:12px">${t}</small>`;

async function go(code, quiet) {
  try { const d = await open(code); try { localStorage.setItem('mjb_code', code); } catch (e) {} document.getElementById('gate').hidden = true; document.getElementById('err').textContent = ''; document.getElementById('app').hidden = false; render(d); return true; }
  catch (e) { if (!quiet) document.getElementById('err').textContent = '비밀번호가 맞지 않아요'; return false; }
}
document.getElementById('gf').addEventListener('submit', (e) => { e.preventDefault(); go(document.getElementById('code').value.trim()); });
let saved = ''; try { saved = localStorage.getItem('mjb_code') || ''; } catch (e) {}
if (saved) go(saved, true);
setInterval(() => { let c = ''; try { c = localStorage.getItem('mjb_code') || ''; } catch (e) {} if (c && !document.hidden) go(c, true); }, 10 * 60e3);
</script>
<script>/* 1112 MJ 'PC·맥에선 텔레그램 프로그램이 늘 열려 있으니 거기서 바로' → 폰 = t.me(앱으로 넘어감), PC·맥 = tg:// (데스크톱 텔레그램 앱이 바로 열림) */

cdTick(); setInterval(cdTick, 60e3); new MutationObserver(() => cdTick()).observe(document.getElementById('app'), { childList: true });
