<style>

.chip.hot{background:var(--org);color:#fff}.chip.hot b{color:#fff}

.rvs{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px;margin-bottom:10px}@media (max-width:760px){.rvs{grid-template-columns:repeat(2,minmax(0,1fr))}}

.lg{font-style:normal;font-size:11px;font-weight:800;padding:2px 6px;border-radius:6px;background:var(--pri-soft);color:var(--pri);margin-right:6px;vertical-align:1px}
.mp{display:grid;grid-template-columns:minmax(86px,1.3fr) repeat(4,minmax(0,1fr));gap:4px}
.mh{font-size:12px;font-weight:800;color:var(--mute);text-align:center;padding-bottom:2px}.mt{font-size:13px;font-weight:800;display:flex;align-items:center;line-height:1.25;word-break:keep-all}
.mc{border-radius:10px;padding:6px 3px;text-align:center;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;min-width:0}.mc b{font-size:12.5px;font-weight:900;white-space:nowrap}
.m-on{background:var(--ok-soft);color:var(--ok)}.m-plan{background:var(--pri-soft);color:var(--pri)}.m-plan.late{background:var(--bad-soft);color:var(--bad)}.m-todo{background:var(--org-soft);color:var(--org);outline:1.5px dashed var(--org);outline-offset:-2px}.m-na{background:var(--tray);color:var(--mute);opacity:.55}
.pp{display:flex;gap:3px}.pp i{width:8px;height:8px;border-radius:50%;border:1.5px solid color-mix(in srgb,var(--c) 30%,transparent)}.pp i.on{background:var(--c);border-color:var(--c)}.pp i.wait{border:1.5px dashed var(--org)}

      <div class="mp"><div></div>${BM.cols.map((c) => `<div class="mh">${esc(c)}</div>`).join('')}${BM.rows.map((r) => `<div class="mt">${esc(r.topic)}</div>${r.cells.map(ce).join('')}`).join('')}</div>
      ${(BM.mj || []).length ? `<div class="mmj"><b>🙋 MJ 차례 — 이것만 해 주면 칸이 채워져요</b><div class="chips">${BM.mj.map((m) => `<span class="chip"><b>${m.no != null ? m.no : '·'}</b>${esc(m.what)}</span>`).join('')}</div></div>` : ''}${nx0 ? `<div class="mnx">👉 다음 채울 칸(제 차례): ${esc(nx0.date)} ${[...new Set(nxs.map((c) => c.topic))].map(esc).join(', ')} · ${nxs.map((c) => esc(c.col)).join('·')}<small>칸 하나 = 블로그(글자) + 점 5개(유튜브·인스타·스레드·X·틱톡). 색 칠한 점 = 이미 있음</small></div>` : ''}</section>`));
  }
  // 1111 MJ '그전에 공개됐던 영상들 조회수 추적 · 어떤 영상이 많은지 · 왜 많은지 분석'
  const VT = d.vtrack;
  if (VT && VT.top && VT.top.length) {
    const r = (x, i) => `<tr><td class="n">${i + 1}</td><td><a href="${esc(x.link)}" target="_blank" rel="noopener">${esc(x.t)}</a><small>${esc(x.ch)} · ${esc(x.d.slice(5).replace('-', '/'))} · ${x.s}초</small>${x.tags.map((t) => `<span class="vtg">${esc(t)}</span>`).join('')}</td><td class="n">${fmt(x.v)}${x.g != null ? `<small class="${x.g > 0 ? 'up' : ''}">${x.g > 0 ? '▲' + fmt(x.g) : '–'}</small>` : ''}</td></tr>`;
    app.append($(`<section class="card"><div class="hd"><span class="ic c-red">🏆</span>영상 조회수 순위<small>5채널 ${VT.n}개 · 매일 쌓아요${VT.prevDay ? ' · ▲ = ' + (+VT.prevDay.slice(5, 7)) + '/' + (+VT.prevDay.slice(8)) + '보다' : ''}</small></div>

  }
  const U = d.upcoming || [], A = d.adsense || [];
  app.append($(`<div class="cols"><section class="card"><div class="hd"><span class="ic c-red">🎬</span>다음 공개·제작 예정</div>${U.length ? U.map((u) => `<div class="dd"><span class="badge blue">${esc(u.when.slice(5, 10).replace('-', '/'))}</span><div class="x">${u.link ? `<a href="${esc(u.link)}" target="_blank" rel="noopener"><b>${esc(u.what)}</b></a>` : `<b>${esc(u.what)}</b>`}<small>${esc(u.when.slice(11))} · ${esc(u.channel || '')}</small></div></div>`).join('') : '<p class="foot">예정된 게 없어요</p>'}</section><section class="card"><div class="hd"><span class="ic c-yel">💰</span>애드센스 신청까지</div>${A.map((a) => `<div class="dd"><span class="badge ${a.days_left <= 3 ? 'hot' : ''}">${a.days_left <= 0 ? '오늘!' : 'D-' + a.days_left}</span><div class="x"><b>${esc(a.blog)}</b><small>${esc(a.date.slice(5).replace('-', '/'))}${a.note ? ' · ' + esc(a.note) : ''}</small></div></div>`).join('')}</section></div>`));
  const BG = [['영양제', '💊'], ['약국·뷰티', '💄'], ['생활·쇼핑', '🛒'], ['돈·경제', '💰'], ['기타', '📝']];
  const ymax = Math.max(1, ...d.youtube.map((r) => r.views || 0)), bmax = Math.max(1, ...d.blogs.map((r) => r.posts || 0));
  app.append($(`<div class="cols"><section class="card"><div class="hd"><span class="ic c-red">▶️</span>유튜브 채널<small>구독 · 총 조회</small></div><div class="rows">${d.youtube.map((r) => `<div class="r"><span class="nm">${esc(r.channel)}</span><span class="v">${fmt(r.subs)}<small style="color:var(--mute)"> 구독</small></span><div class="mini"><i style="width:${(100 * (r.views || 0) / ymax).toFixed(0)}%"></i></div><div class="s"><span>조회 ${fmt(r.views)}</span><span>영상 ${fmt(r.videos)}</span>${r.subs_change != null ? `<em class="${ud(r.subs_change)}">구독 ${sg(r.subs_change) || '그대로'}</em>` : ''}${r.views_change != null ? `<em class="${ud(r.views_change)}">조회 ${sg(r.views_change) || '그대로'}</em>` : ''}</div></div>`).join('')}</div></section><section class="card"><div class="hd"><span class="ic c-blue">📝</span>블로그 주제별<small>전체 글 · 오늘</small></div>${BG.map(([g, ic]) => { const LO = ['한국어', '영어', '일본어', '대만'], L = d.blogs.filter((r) => (r.group || '기타') === g).sort((x, y) => LO.indexOf(x.lang) - LO.indexOf(y.lang)); if (!L.length) return ''; const tt = L.reduce((t, r) => t + (r.today || 0), 0); return `<div class="bgh">${ic} ${esc(g)}<small>${L.length}곳 · 전체 ${fmt(L.reduce((t, r) => t + (r.posts || 0), 0))}${tt ? ` · <b class="up">오늘 +${tt}</b>` : ''}</small></div><div class="rows">${L.map((r) => `<div class="r"><span class="nm"><em class="lg">${esc(r.lang || '')}</em>${esc(r.blog)}</span><span class="v">${fmt(r.posts)}${r.today ? `<small style="color:var(--ok)"> +${r.today}</small>` : ''}</span><div class="mini"><i style="width:${(100 * (r.posts || 0) / bmax).toFixed(0)}%"></i></div></div>`).join('')}</div>`; }).join('')}</section></div>`));
  const W = 640, H = 190, m = 24, bw = (W - 16) / Math.max(1, v.length), mx = Math.max(1, ...v.map((x) => x.visitors));

  const show = (t) => { tabs.querySelectorAll('button').forEach((b) => b.setAttribute('aria-selected', b.dataset.t === t)); app.hidden = t !== 'board'; cmt.hidden = t === 'board'; };

  cmt.addEventListener('click', (e) => { const x = e.target.closest('.cm-x'); if (x) x.classList.toggle('open'); });

async function go(code, quiet) {
  try { const d = await open(code); try { localStorage.setItem('mjb_code', code); } catch (e) {} document.getElementById('gate').hidden = true; document.getElementById('err').textContent = ''; document.getElementById('app').hidden = false; render(d); return true; }
  catch (e) { if (!quiet) document.getElementById('err').textContent = '비밀번호가 맞지 않아요'; return false; }
}
document.getElementById('gf').addEventListener('submit', (e) => { e.preventDefault(); go(document.getElementById('code').value.trim()); });
let saved = ''; try { saved = localStorage.getItem('mjb_code') || ''; } catch (e) {}
if (saved) go(saved, true);
setInterval(() => { let c = ''; try { c = localStorage.getItem('mjb_code') || ''; } catch (e) {} if (c && !document.hidden) go(c, true); }, 10 * 60e3);
</script>
